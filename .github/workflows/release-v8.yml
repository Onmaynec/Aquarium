name: Release V8
on:
  push:
    tags: ['v8.0.0']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/deep-sea-overlay-test.js
      - run: node tests/genetics-lab-test.js
      - run: node tests/v8-runtime-test.js
      - run: python3 scripts/build-v8-release.py dist/stage
      - name: Build archives
        run: |
          mkdir -p dist/portable dist/source
          cp -a dist/stage/. dist/portable/
          cp -a dist/stage/. dist/source/
          rm -rf dist/portable/tests dist/portable/scripts
          (cd dist/portable && zip -Xqr ../Aquarium-V8.0.0-Marine-Genetics-Lab-Portable.zip .)
          (cd dist/source && zip -Xqr ../Aquarium-V8.0.0-Marine-Genetics-Lab-Source.zip .)
          (cd dist && sha256sum Aquarium-V8.0.0-Marine-Genetics-Lab-Portable.zip Aquarium-V8.0.0-Marine-Genetics-Lab-Source.zip > Aquarium-V8.0.0-SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v8.0.0 \
            dist/Aquarium-V8.0.0-Marine-Genetics-Lab-Portable.zip \
            dist/Aquarium-V8.0.0-Marine-Genetics-Lab-Source.zip \
            dist/Aquarium-V8.0.0-SHA256SUMS.txt \
            --title 'Living Aquarium V8 Marine Genetics Lab' \
            --notes-file RELEASE_NOTES-V8.md \
            --verify-tag
