name: Upgrade Aquarium to V3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v3:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Repair legacy chunk joiner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build_v3.py')
          text = path.read_text(encoding='utf-8')
          old = "app = ''.join(p.read_text(encoding='utf-8') for p in parts)"
          new = """chunks = [p.read_text(encoding='utf-8') for p in parts]
          app = chunks[0]
          for chunk in chunks[1:]:
              overlap = 0
              limit = min(1024, len(app), len(chunk))
              for size in range(limit, 0, -1):
                  if app.endswith(chunk[:size]):
                      overlap = size
                      break
              app += chunk[overlap:]"""
          if old not in text:
              raise SystemExit('Legacy join expression was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Build local-friendly V3
        run: python tools/build_v3.py

      - name: Validate generated application
        run: |
          node --check app.js
          node --check assets/manifest.js
          grep -q 'assets/manifest.js' index.html
          grep -q 'app.js' index.html
          grep -q 'Living Aquarium V3' index.html
          test -f START-AQUARIUM.bat

      - name: Commit V3 to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/build_v3.py .github/workflows/upgrade-v3.yml
          git rm -f .v3-build-request
          git add -A
          git commit -m "Release Living Aquarium V3"
          git push origin HEAD:${{ github.head_ref }}
