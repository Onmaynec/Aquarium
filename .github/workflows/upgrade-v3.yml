name: Upgrade Aquarium to V3

on:
  push:
    branches: [main]
    paths:
      - tools/build_v3.py
      - .github/workflows/upgrade-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build local-friendly V3
        run: python tools/build_v3.py

      - name: Validate generated application
        run: |
          node --check app.js
          node --check assets/manifest.js
          grep -q 'assets/manifest.js' index.html
          grep -q 'app.js' index.html
          test -f START-AQUARIUM.bat

      - name: Commit V3 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tools/build_v3.py .github/workflows/upgrade-v3.yml
          git add -A
          git commit -m "Release Living Aquarium V3"
          git push origin main
