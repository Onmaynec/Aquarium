name: Materialize Aquarium V5

on:
  push:
    branches: [agent/aquarium-v5-evolution]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract V5 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk.* > /tmp/aquarium-v5.b64
          echo '5217e7c0f16be463d6cd08b6cc32db71db7d1f26bb1bab88cb44cf0cf439d47f  /tmp/aquarium-v5.b64' | sha256sum -c -
          base64 -d /tmp/aquarium-v5.b64 > /tmp/aquarium-v5.tar.gz
          echo 'df8088ce14337fdc51de1eec968820c887615a0d65690ebfc504de2f2efe5951  /tmp/aquarium-v5.tar.gz' | sha256sum -c -
          tar -xzf /tmp/aquarium-v5.tar.gz

      - name: Generate PWA icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          def write_png(size, path):
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      t = y / max(1, size - 1)
                      r, g, b, a = int(4 + 4*t), int(44 - 20*t), int(74 - 35*t), 255
                      cx, cy = size * .49, size * .50
                      rx, ry = size * .26, size * .13
                      body = ((x-cx)/rx)**2 + ((y-cy)/ry)**2 <= 1
                      tail = x < size*.27 and abs(y-cy) < (size*.27-x)*.62
                      eye = (x-size*.60)**2 + (y-size*.46)**2 <= (size*.025)**2
                      bubble = (x-size*.73)**2 + (y-size*.25)**2 <= (size*.055)**2
                      if body: r,g,b = 55,211,255
                      if tail: r,g,b = 255,191,71
                      if eye: r,g,b = 3,18,30
                      if bubble: r,g,b,a = 205,248,255,205
                      row.extend((r,g,b,a))
                  rows.append(bytes(row))
              data = b''.join(rows)
              def chunk(kind, payload):
                  return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(data, 9)) + chunk(b'IEND', b'')
              Path(path).write_bytes(png)

          Path('assets').mkdir(exist_ok=True)
          write_png(192, 'assets/icon-192.png')
          write_png(512, 'assets/icon-512.png')
          PY

      - name: Validate materialized project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v5.yml
          test "$(cat VERSION)" = '5.0.0'
          node --check app.js
          node --check assets/manifest.js
          node --check service-worker.js
          node tests/smoke-test.js
          node tests/integrity-test.js

      - name: Commit V5 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Living Aquarium V5 Evolution'
          git push origin HEAD:agent/aquarium-v5-evolution
