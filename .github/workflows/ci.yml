name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check bootstrap.js
      - run: node --check service-worker.js
      - run: node --check assets/manifest.js
      - run: node tests/payload-test.js
      - run: |
          test "$(cat VERSION)" = '6.0.0'
          grep -q 'Living Aquarium V6 Ocean Lab' README.md
          test -f assets/icon-192.png
          test -f assets/icon-512.png

  retarget-release-tag:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/retarget-v6-tag' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move v6.0.0 to clean release commit
        run: bash .github/scripts/retarget-v6-tag.sh
