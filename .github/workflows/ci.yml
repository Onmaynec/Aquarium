name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check bootstrap.js
      - run: node --check service-worker.js
      - run: node --check assets/manifest.js
      - run: node tests/payload-test.js
      - run: |
          test "$(cat VERSION)" = '5.0.0'
          grep -q 'Living Aquarium V5 Evolution' README.md
          test -f assets/icon-192.png
          test -f assets/icon-512.png

  finalize-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/finalize-v5-release' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/finalize-v5.sh
