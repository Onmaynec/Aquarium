name: Tag V6 Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'Release Living Aquarium V6 Ocean Lab')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v6.0.0 tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v6.0.0 >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v6.0.0 -m 'Living Aquarium V6 Ocean Lab'
          git push origin v6.0.0
