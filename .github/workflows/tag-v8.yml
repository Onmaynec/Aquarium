name: Tag V8
on:
  push:
    branches: [main]
    paths: ['VERSION-V8']
permissions:
  contents: write
jobs:
  tag:
    if: github.repository == 'Onmaynec/Aquarium'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          test "$(cat VERSION-V8)" = '8.0.0'
          node tests/genetics-lab-test.js
          node tests/v8-runtime-test.js
      - name: Create annotated tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin refs/tags/v8.0.0 >/dev/null 2>&1; then exit 0; fi
          git tag -a v8.0.0 -m 'Living Aquarium V8 Marine Genetics Lab'
          git push origin v8.0.0
