name: Tag V7 Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'Release Living Aquarium V7 Deep Sea Expedition')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v7.0.0 tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v7.0.0 >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v7.0.0 -m 'Living Aquarium V7 Deep Sea Expedition'
          git push origin v7.0.0
