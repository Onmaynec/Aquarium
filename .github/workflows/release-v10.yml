name: Release V10
on:
  push:
    tags: ['v10.0.0']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/deep-sea-overlay-test.js
      - run: node tests/genetics-lab-test.js
      - run: node tests/restoration-center-test.js
      - run: node tests/command-center-test.js
      - run: node tests/v10-runtime-test.js
      - run: python3 scripts/build-v10-release.py dist/stage
      - name: Validate staged build
        run: |
          cd dist/stage
          node tests/smoke-test.js
          node tests/integrity-test.js
          node tests/ocean-lab-test.js
          node tests/deep-sea-overlay-test.js
          node tests/genetics-lab-test.js
          node tests/restoration-center-test.js
          node tests/command-center-test.js
      - name: Build archives
        run: |
          mkdir -p dist/portable dist/source
          cp -a dist/stage/. dist/portable/
          cp -a dist/stage/. dist/source/
          rm -rf dist/portable/tests dist/portable/scripts
          (cd dist/portable && zip -Xqr ../Aquarium-V10.0.0-Ocean-Command-Center-Portable.zip .)
          (cd dist/source && zip -Xqr ../Aquarium-V10.0.0-Ocean-Command-Center-Source.zip .)
          (cd dist && sha256sum Aquarium-V10.0.0-Ocean-Command-Center-Portable.zip Aquarium-V10.0.0-Ocean-Command-Center-Source.zip > Aquarium-V10.0.0-SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v10.0.0 \
            dist/Aquarium-V10.0.0-Ocean-Command-Center-Portable.zip \
            dist/Aquarium-V10.0.0-Ocean-Command-Center-Source.zip \
            dist/Aquarium-V10.0.0-SHA256SUMS.txt \
            --title 'Living Aquarium V10 Ocean Command Center' \
            --notes-file RELEASE_NOTES-V10.md \
            --verify-tag
