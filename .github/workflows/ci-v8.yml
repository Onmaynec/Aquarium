name: CI V8
on:
  pull_request:
    branches: [main]
    paths:
      - 'v8.html'
      - 'bootstrap-v8.js'
      - 'v8-genetics.js'
      - 'VERSION-V8'
      - 'README-V8.md'
      - 'CHANGELOG-V8.md'
      - 'RELEASE_NOTES-V8.md'
      - 'manifest-v8.webmanifest'
      - 'service-worker-v8.js'
      - 'tests/genetics-lab-test.js'
      - 'tests/v8-runtime-test.js'
      - 'scripts/build-v8-release.py'
      - '.github/workflows/ci-v8.yml'
      - '.github/workflows/release-v8.yml'
      - '.github/workflows/tag-v8.yml'
  push:
    branches: [main]
    paths:
      - 'v8.html'
      - 'bootstrap-v8.js'
      - 'v8-genetics.js'
      - 'VERSION-V8'
      - 'tests/genetics-lab-test.js'
      - 'tests/v8-runtime-test.js'
permissions:
  contents: read
jobs:
  validate-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check bootstrap-v8.js
      - run: node --check v8-genetics.js
      - run: node --check service-worker-v8.js
      - run: node tests/deep-sea-overlay-test.js
      - run: node tests/genetics-lab-test.js
      - run: node tests/v8-runtime-test.js
      - run: python3 scripts/build-v8-release.py dist/v8-stage
      - run: |
          test "$(cat VERSION-V8)" = '8.0.0'
          grep -q 'Marine Genetics Lab' README-V8.md
          test -f dist/v8-stage/index.html
          test -f dist/v8-stage/v7-expedition.js
          test -f dist/v8-stage/v8-genetics.js
          cd dist/v8-stage
          node tests/smoke-test.js
          node tests/integrity-test.js
          node tests/ocean-lab-test.js
          node tests/deep-sea-overlay-test.js
          node tests/genetics-lab-test.js
