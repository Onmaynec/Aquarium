name: Finalize V9 Release
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize-v9:
    if: github.repository == 'Onmaynec/Aquarium' && github.head_ref == 'agent/finalize-v9-release' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and publish V9
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/finalize-v9.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aquarium-v9-release-assets
          path: dist/v9-release/*
          if-no-files-found: error
