<div class="hud"><div class="top"><section class="brand glass"><h1>🌊 Living Aquarium</h1><p>Boids • умный хищник • живая экосистема • один HTML-файл</p></section><section class="stats glass"><div class="stat">Рыбки<b id="fishCount">0</b></div><div class="stat">FPS<b id="fps">60</b></div></section></div><div class="toast" id="toast"></div><aside class="panel glass" id="panel"><h2>⚙️ Настройки симуляции</h2><div class="control"><label>Разделение <output id="sepOut"></output></label><input id="separation" type="range" min="0" max="3" step=".1"></div><div class="control"><label>Выравнивание <output id="aliOut"></output></label><input id="alignment" type="range" min="0" max="3" step=".1"></div><div class="control"><label>Сплочение <output id="cohOut"></output></label><input id="cohesion" type="range" min="0" max="3" step=".1"></div><div class="control"><label>Скорость рыб <output id="speedOut"></output></label><input id="speed" type="range" min=".4" max="1.8" step=".1"></div><div class="control"><label>Пузырьки <output id="bubbleOut"></output></label><input id="bubbleRate" type="range" min=".2" max="2.5" step=".1"></div><div class="checks"><label class="check"><input id="sound" type="checkbox"> Звук воды</label><label class="check"><input id="caustics" type="checkbox"> Каустика</label></div><div class="panel-actions"><button id="save">💾 Сохранить</button><button id="reset">↺ Сбросить</button></div></aside><nav class="dock glass"><button id="feed">🍽️ Покормить</button><button id="add">🐟 Добавить</button><button id="night" aria-pressed="false">🌙 Ночь</button><button id="soundBtn" aria-pressed="false">🔇 Звук</button><button id="settings" class="settings-toggle" aria-pressed="false">⚙️</button></nav><div class="hint">Кликните или коснитесь воды — рыбы разбегутся на 2 секунды</div></div><noscript><div class="noscript">Для запуска аквариума нужен JavaScript.</div></noscript>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#aquarium'),ctx=canvas.getContext('2d',{alpha:false}),TAU=Math.PI*2,rand=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;let W=innerWidth,H=innerHeight,DPR=1,last=performance.now(),night=false,scare=null,frameN=0,fpsTime=0,audio=null,toastTimer=0;const defaults={separation:1.55,alignment:1.05,cohesion:.82,speed:1,bubbleRate:1,sound:false,caustics:true};let cfg={...defaults,...loadJSON('aquarium-settings')};const fish=[],bubbles=[],flakes=[],plants=[],rocks=[],corals=[],shrimp=[],snails=[],motes=[];const species=[{name:'неон',body:'#36d5ff',accent:'#f1fbff',shape:'slim',size:[11,15],speed:[62,82]},{name:'золотая',body:'#ffb347',accent:'#fff1a7',shape:'round',size:[15,20],speed:[45,65]},{name:'танг',body:'#497cff',accent:'#ffe15b',shape:'disc',size:[14,19],speed:[52,72]},{name:'гуппи',body:'#d474ff',accent:'#ff8fb6',shape:'fan',size:[11,16],speed:[57,77]},{name:'ангел',body:'#d8eef2',accent:'#212d48',shape:'angel',size:[15,21],speed:[42,61]}];function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1}function hash(n){return(Math.sin(n*127.1)*43758.5453)%1}function loadJSON(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return{}}}function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);seed(true)}function seed(resized=false){if(!plants.length){for(let i=0;i<22;i++)plants.push({x:rand(0,W),h:rand(20,55),target:rand(75,190),phase:rand(0,99),w:rand(2.5,7),growth:rand(1,3.2)});for(let i=0;i<9;i++)rocks.push({x:rand(0,W),y:H-rand(10,36),rx:rand(18,58),ry:rand(10,30),rot:rand(-.3,.3)});for(let i=0;i<7;i++)corals.push({x:rand(20,W-20),h:rand(35,95),color:`hsl(${rand(5,355)} 65% 58%)`,phase:rand(0,TAU)});for(let i=0;i<4;i++)shrimp.push({x:rand(20,W-20),y:H-rand(25,48),dir:Math.random()<.5?-1:1,phase:rand(0,TAU)});for(let i=0;i<3;i++)snails.push({x:rand(20,W-20),y:H-rand(18,33),dir:Math.random()<.5?-1:1,speed:rand(2,5)});for(let i=0;i<80;i++)motes.push({x:rand(0,W),y:rand(0,H),r:rand(.4,1.7),p:rand(0,TAU)})}if(resized){plants.forEach((p,i)=>p.x=(i+.5)/plants.length*W);rocks.forEach((r,i)=>{r.x=(i+.5)/rocks.length*W;r.y=H-rand(10,35)});corals.forEach((c,i)=>c.x=(i+.6)/corals.length*W);shrimp.forEach(s=>s.y=H-rand(25,48));snails.forEach(s=>s.y=H-rand(18,33))}}class Fish{constructor(o={}){this.predator=!!o.predator;this.spec=o.spec??Math.floor(rand(0,species.length));const sp=species[this.spec];this.x=o.x??rand(70,Math.max(71,W-70));this.y=o.y??rand(90,Math.max(91,H*.72));const a=rand(0,TAU),v=this.predator?35:rand(...sp.speed);this.vx=Math.cos(a)*v;this.vy=Math.sin(a)*v;this.ax=0;this.ay=0;this.size=this.predator?26:rand(...sp.size);this.maxSpeed=this.predator?58:sp.speed[1];this.maxForce=this.predator?42:52;this.phase=rand(0,TAU);this.pause=0;this.protect=1.4}steer(tx,ty,scale=1){let dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy)||1,dx2=dx/d*this.maxSpeed-this.vx,dy2=dy/d*this.maxSpeed-this.vy,m=Math.hypot(dx2,dy2)||1,s=Math.min(this.maxForce,m)/m*scale;return{x:dx2*s,y:dy2*s}}update(dt,now){this.ax=this.ay=0;this.protect=Math.max(0,this.protect-dt);const slow=night?.48:1;if(this.predator){let prey=null,best=Infinity;for(const f of fish)if(!f.predator){const d=(f.x-this.x)**2+(f.y-this.y)**2;if(d<best){best=d;prey=f}}if(prey){const lead=Math.sqrt(best)/(this.maxSpeed+1),p=this.steer(prey.x+prey.vx*lead*.45,prey.y+prey.vy*lead*.45,1.15);this.ax+=p.x;this.ay+=p.y;const avoid=wallForce(this,90);this.ax+=avoid.x*1.3;this.ay+=avoid.y*1.3;if(best<(this.size+prey.size*.55)**2&&prey.protect<=0)respawn(prey)}}else{this.boids();const predator=fish.find(f=>f.predator);if(predator){let dx=this.x-predator.x,dy=this.y-predator.y,d=Math.hypot(dx,dy);if(d<230&&d>0){const q=(1-d/230)*650/d;this.ax+=dx*q;this.ay+=dy*q}}if(scare&&now<scare.until){let dx=this.x-scare.x,dy=this.y-scare.y,d=Math.hypot(dx,dy);if(d<330&&d>0){const q=(1-d/330)*850/d;this.ax+=dx*q;this.ay+=dy*q;this.pause=0}}const target=nearestFood(this);if(target){const s=this.steer(target.x,target.y,.95);this.ax+=s.x;this.ay+=s.y;if((target.x-this.x)**2+(target.y-this.y)**2<250){target.dead=true;this.pause=rand(.5,1.3)}}else if(this.pause<=0&&Math.random()<dt*.018)this.pause=rand(.7,2.1);if(this.pause>0){this.pause-=dt;this.vx*=Math.pow(.24,dt);this.vy*=Math.pow(.24,dt)}}const wf=wallForce(this,this.predator?100:75);this.ax+=wf.x;this.ay+=wf.y;this.vx+=this.ax*dt;this.vy+=this.ay*dt;const limit=this.maxSpeed*cfg.speed*slow,m=Math.hypot(this.vx,this.vy);if(m>limit){this.vx=this.vx/m*limit;this.vy=this.vy/m*limit}this.x+=this.vx*dt;this.y+=this.vy*dt;this.x=clamp(this.x,8,W-8);this.y=clamp(this.y,40,H-35);this.phase+=dt*(3+Math.hypot(this.vx,this.vy)*.025)}boids(){let sx=0,sy=0,ax=0,ay=0,cx=0,cy=0,n=0,ns=0;for(const o of fish){if(o===this||o.predator)continue;let dx=this.x-o.x,dy=this.y-o.y,d2=dx*dx+dy*dy;if(d2<1)continue;if(d2<58**2){sx+=dx/(d2+.01);sy+=dy/(d2+.01);ns++}if(d2<145**2){ax+=o.vx;ay+=o.vy;cx+=o.x;cy+=o.y;n++}}if(ns){this.ax+=sx/ns*1500*cfg.separation;this.ay+=sy/ns*1500*cfg.separation}if(n){ax/=n;ay/=n;cx/=n;cy/=n;this.ax+=(ax-this.vx)*.5*cfg.alignment;this.ay+=(ay-this.vy)*.5*cfg.alignment;const c=this.steer(cx,cy,.24*cfg.cohesion);this.ax+=c.x;this.ay+=c.y}this.ax+=noise1(this.phase*.11)*4;this.ay+=noise1(this.phase*.11+20)*4}draw(now){const sp=species[this.spec],a=Math.atan2(this.vy,this.vx),flip=Math.cos(a)<0?-1:1;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(a);ctx.scale(1,flip);this.predator?drawShark(this.size,now,this.phase):drawFish(sp,this.size,now,this.phase,this.pause>0);ctx.restore()}}function wallForce(f,m){let x=0,y=0;if(f.x<m)x+=(m-f.x)/m*f.maxForce*2.4;if(f.x>W-m)x-=(f.x-(W-m))/m*f.maxForce*2.4;if(f.y<m+25)y+=(m+25-f.y)/m*f.maxForce*2.2;if(f.y>H-m)y-=(f.y-(H-m))/m*f.maxForce*2.8;return{x,y}}function drawFish(sp,s,now,p,eating){ctx.save();ctx.shadowColor='#00152288';ctx.shadowBlur=8;ctx.fillStyle=sp.body;ctx.beginPath();if(sp.shape==='disc')ctx.ellipse(0,0,s*1.2,s*.9,0,0,TAU);else if(sp.shape==='angel'){ctx.moveTo(-s*.9,0);ctx.quadraticCurveTo(0,-s*1.25,s,0);ctx.quadraticCurveTo(0,s*1.25,-s*.9,0)}else ctx.ellipse(0,0,s*1.45,sp.shape==='round'?s*.78:s*.55,0,0,TAU);ctx.fill();ctx.shadowBlur=0;const wag=Math.sin(now*.012+p)*s*.18;ctx.fillStyle=sp.accent;ctx.beginPath();ctx.moveTo(-s*1.2,0);ctx.lineTo(-s*2,-s*.72+wag);ctx.lineTo(-s*1.86,s*.72+wag);ctx.closePath();ctx.fill();ctx.globalAlpha=.8;ctx.fillStyle=sp.accent;ctx.beginPath();ctx.moveTo(-s*.2,0);ctx.lineTo(s*.4,s*.75);ctx.lineTo(s*.62,0);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#07131c';ctx.beginPath();ctx.arc(s*.72,-s*.17,Math.max(1.5,s*.1),0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.75,-s*.2,Math.max(.5,s*.035),0,TAU);ctx.fill();if(eating){ctx.strokeStyle='#d9fbff';ctx.beginPath();ctx.arc(s*1.25,0,s*.13,-.8,.8);ctx.stroke()}ctx.restore()}function drawShark(s,now,p){ctx.fillStyle='#ef4b5a';ctx.beginPath();ctx.ellipse(0,0,s*1.55,s*.58,0,0,TAU);ctx.fill();ctx.fillStyle='#c82f45';ctx.beginPath();ctx.moveTo(-s*1.35,0);ctx.lineTo(-s*2.15,-s*.9+Math.sin(now*.009+p)*5);ctx.lineTo(-s*1.95,s*.9+Math.sin(now*.009+p)*5);ctx.fill();ctx.beginPath();ctx.moveTo(-s*.3,-s*.45);ctx.lineTo(s*.2,-s*1.2);ctx.lineTo(s*.55,-s*.38);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s*.82,-s*.16,3,0,TAU);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s*.98,-s*.16,1.8,0,TAU);ctx.fill()}function nearestFood(f){let t=null,b=240**2;for(const x of flakes)if(!x.dead){const d=(x.x-f.x)**2+(x.y-f.y)**2;if(d<b){b=d;t=x}}return t}function safeSpawn(){const p=fish.find(f=>f.predator);for(let i=0;i<20;i++){const q={x:rand(55,W-55),y:rand(80,H*.65)};if(!p||(q.x-p.x)**2+(q.y-p.y)**2>300**2)return q}return{x:W*.15,y:H*.25}}function respawn(prey){const q=safeSpawn(),i=fish.indexOf(prey);burst(prey.x,prey.y,16);fish[i]=new Fish({x:q.x,y:q.y,spec:prey.spec});toast('🦈 Хищник поймал рыбку — появилась новая');updateCount();saveState()}function addFish(){const q=safeSpawn(),p=fish.findIndex(f=>f.predator),f=new Fish({x:q.x,y:q.y});p<0?fish.push(f):fish.splice(p,0,f);updateCount();saveState();toast(`🐟 Добавлена рыбка: ${species[f.spec].name}`)}function feed(){for(let i=0;i<26;i++)flakes.push({x:rand(W*.16,W*.84),y:rand(-100,-8),vx:rand(-8,8),vy:rand(20,42),r:rand(2,4.4),phase:rand(0,TAU),dead:false});toast('🍽️ Корм падает — рыбки уже плывут!')}function burst(x,y,n){for(let i=0;i<n;i++)bubbles.push({x:x+rand(-10,10),y:y+rand(-6,6),r:rand(2,6),vy:rand(35,80),phase:rand(0,TAU)})}function drawBackground(now){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,night?'#01050d':'#062c52');g.addColorStop(.55,night?'#020c1b':'#074067');g.addColorStop(1,night?'#020811':'#031b2b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(cfg.caustics){ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=night?.025:.13;for(let i=0;i<8;i++){const y=H*(.08+i*.08),amp=20+i*2;ctx.strokeStyle='rgba(135,235,255,.2)';ctx.lineWidth=5+i*.6;ctx.beginPath();for(let x=-30;x<W+30;x+=18){const yy=y+noise1(x*.013+now*.00018+i*8)*amp+Math.sin(x*.02+now*.001+i)*7;x===-30?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke()}ctx.restore()}for(const m of motes){m.y-=.06;m.x+=Math.sin(now*.0007+m.p)*.03;if(m.y<0)m.y=H;ctx.fillStyle='rgba(220,250,255,.13)';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,TAU);ctx.fill()}}function drawFloor(){let g=ctx.createLinearGradient(0,H-100,0,H);g.addColorStop(0,'rgba(10,30,35,0)');g.addColorStop(1,night?'#081014':'#164044');ctx.fillStyle=g;ctx.fillRect(0,H-110,W,110);ctx.fillStyle=night?'#10191c':'#315b52';ctx.fillRect(0,H-25,W,25);for(const r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.shadowColor='#0008';ctx.shadowBlur=14;ctx.shadowOffsetY=8;ctx.fillStyle=night?'#263239':'#58736f';ctx.beginPath();ctx.ellipse(0,0,r.rx,r.ry,0,Math.PI,TAU);ctx.fill();ctx.restore()}}function drawPlants(dt,now){for(const p of plants){p.h=Math.min(p.target,p.h+p.growth*dt);const n=noise1(now*.00032+p.phase)*14;ctx.save();ctx.translate(p.x,H-25);ctx.lineCap='round';ctx.lineWidth=p.w;ctx.strokeStyle=night?'#275541':'#55d893';ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(n*.1,-p.h*.35,n*.75,-p.h*.72,n,-p.h);ctx.stroke();ctx.restore()}}function drawCorals(now){for(const c of corals){ctx.save();ctx.translate(c.x,H-25);ctx.strokeStyle=night?'#532e48':c.color;ctx.lineCap='round';ctx.lineWidth=5;branch(0,0,-Math.PI/2,c.h,0,c.phase+now*.0002);ctx.restore()}function branch(x,y,a,len,d,p){if(d>3||len<9)return;const sway=noise1(p+d*7)*.12,x2=x+Math.cos(a+sway)*len,y2=y+Math.sin(a+sway)*len;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();branch(x2,y2,a-.55,len*.62,d+1,p+2);branch(x2,y2,a+.55,len*.59,d+1,p+5)}}function drawCritters(dt,now){for(const s of shrimp){s.x+=s.dir*6*dt;if(s.x<8||s.x>W-8)s.dir*=-1;ctx.save();ctx.translate(s.x,s.y);ctx.scale(s.dir,1);ctx.strokeStyle=night?'#7b4655':'#ff8fa2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,9,.25,Math.PI*1.7);ctx.stroke();ctx.restore()}for(const s of snails){s.x+=s.dir*s.speed*dt;if(s.x<12||s.x>W-12)s.dir*=-1;ctx.save();ctx.translate(s.x,s.y);ctx.scale(s.dir,1);ctx.fillStyle=night?'#4d5960':'#b98355';ctx.beginPath();ctx.arc(-2,-2,7,0,TAU);ctx.fill();ctx.strokeStyle='#5d3d2c';ctx.beginPath();ctx.arc(-2,-2,4.5,0,TAU);ctx.stroke();ctx.restore()}}function updateFood(dt,now){for(const f of flakes){f.vy=Math.min(55,f.vy+4*dt);f.x+=(f.vx+Math.sin(now*.003+f.phase)*9)*dt;f.y+=f.vy*dt;if(f.y>H-25)f.dead=true;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(now*.001+f.phase);ctx.fillStyle='#f5d07d';ctx.fillRect(-f.r,-f.r*.45,f.r*2,f.r*.9);ctx.restore()}for(let i=flakes.length-1;i>=0;i--)if(flakes[i].dead)flakes.splice(i,1)}function updateBubbles(dt,now){if(Math.random()<dt*9*cfg.bubbleRate)bubbles.push({x:rand(5,W-5),y:H+10,r:rand(2,8),vy:rand(22,65),phase:rand(0,TAU)});for(const b of bubbles){b.y-=b.vy*dt*(night?.7:1);b.x+=Math.sin(now*.002+b.phase+b.y*.02)*11*dt;const g=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.35,.2,b.x,b.y,b.r);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.18,'rgba(190,242,255,.13)');g.addColorStop(1,'rgba(210,248,255,.28)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fill()}for(let i=bubbles.length-1;i>=0;i--)if(bubbles[i].y<-12)bubbles.splice(i,1)}function animate(now){const dt=Math.min((now-last)/1000,.033);last=now;drawBackground(now);drawFloor();drawCorals(now);drawPlants(dt,now);drawCritters(dt,now);updateFood(dt,now);for(const f of fish)f.update(dt,now);for(const f of fish)f.draw(now);updateBubbles(dt,now);frameN++;if(now-fpsTime>500){$('#fps').textContent=Math.round(frameN*1000/(now-fpsTime||500));frameN=0;fpsTime=now}requestAnimationFrame(animate)}function initAudio(){if(audio)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC(),gain=ac.createGain(),filter=ac.createBiquadFilter(),buffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.35;const src=ac.createBufferSource();src.buffer=buffer;src.loop=true;filter.type='lowpass';filter.frequency.value=620;gain.gain.value=.055;src.connect(filter).connect(gain).connect(ac.destination);src.start();audio={ac,gain};setSound(cfg.sound)}function setSound(on){cfg.sound=!!on;if(audio){audio.ac.resume();audio.gain.gain.setTargetAtTime(on?.055:0,audio.ac.currentTime,.25)}$('#sound').checked=cfg.sound;$('#soundBtn').setAttribute('aria-pressed',String(cfg.sound));$('#soundBtn').textContent=cfg.sound?'🔊 Звук':'🔇 Звук'}function saveState(){saveJSON('aquarium-settings',cfg);saveJSON('aquarium-state',{count:fish.filter(f=>!f.predator).length,species:fish.filter(f=>!f.predator).map(f=>f.spec),night})}function restore(){const s=loadJSON('aquarium-state'),count=clamp(Number(s.count)||7,1,40);for(let i=0;i<count;i++)fish.push(new Fish({spec:Array.isArray(s.species)?s.species[i]%species.length:undefined}));fish.push(new Fish({predator:true,x:W*.78,y:H*.42}));night=!!s.night;syncNight();updateCount()}function reset(){cfg={...defaults};night=false;fish.length=0;localStorage.removeItem('aquarium-state');localStorage.removeItem('aquarium-settings');restore();syncControls();setSound(false);toast('↺ Настройки и экосистема сброшены')}function updateCount(){$('#fishCount').textContent=fish.filter(f=>!f.predator).length}function syncNight(){$('#night').setAttribute('aria-pressed',String(night));$('#night').textContent=night?'☀️ День':'🌙 Ночь'}function syncControls(){for(const id of['separation','alignment','cohesion','speed','bubbleRate'])$('#'+id).value=cfg[id];$('#caustics').checked=cfg.caustics;for(const [id,key] of[['sepOut','separation'],['aliOut','alignment'],['cohOut','cohesion'],['speedOut','speed'],['bubbleOut','bubbleRate']])$('#'+id).textContent=Number(cfg[key]).toFixed(1)}function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}canvas.addEventListener('pointerdown',e=>{scare={x:e.clientX,y:e.clientY,until:performance.now()+2000};burst(e.clientX,e.clientY,14)});$('#feed').onclick=feed;$('#add').onclick=addFish;$('#night').onclick=()=>{night=!night;syncNight();saveState()};$('#settings').onclick=()=>{const open=$('#panel').classList.toggle('open');$('#settings').setAttribute('aria-pressed',String(open))};$('#soundBtn').onclick=()=>{initAudio();setSound(!cfg.sound);saveState()};$('#sound').onchange=e=>{initAudio();setSound(e.target.checked)};$('#caustics').onchange=e=>cfg.caustics=e.target.checked;for(const id of['separation','alignment','cohesion','speed','bubbleRate'])$('#'+id).oninput=e=>{cfg[id]=Number(e.target.value);syncControls()};$('#save').onclick=()=>{saveState();toast('💾 Настройки и состояние сохранены')};$('#reset').onclick=reset;addEventListener('resize',resize,{passive:true});addEventListener('visibilitychange',()=>last=performance.now());resize();syncControls();restore();setSound(false);requestAnimationFrame(animate)})();
