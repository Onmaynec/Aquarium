<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#031d35">
<meta name="description" content="Живой интерактивный аквариум с реалистичным Boids, красивыми ассетами, хищником, кормлением и звуком воды.">
<title>Living Aquarium — Interactive Boids</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="aquarium" aria-label="Интерактивный симулятор аквариума"></canvas>
<div class="loading" id="loading"><div class="loader-card glass"><span class="loader-fish">🐠</span><b>Заселяем аквариум</b><span>Загружаем рыб, растения и подводный мир…</span><div class="progress"><i></i></div></div></div>
<div class="ui">
 <header class="topbar">
  <section class="brand glass"><span class="brand-icon">🌊</span><div><h1>Living Aquarium</h1><p>реалистичный Boids • живые ассеты • умный хищник</p></div></section>
  <section class="stats glass"><div class="stat">Рыбки<b id="fishCount">0</b></div><div class="stat">Хищник<b id="predatorState">охота</b></div><div class="stat">FPS<b id="fps">60</b></div></section>
 </header>
 <div class="toast" id="toast"></div>
 <aside class="panel glass" id="panel">
  <h2>⚙️ Настройки экосистемы</h2><p class="panel-subtitle">Все параметры автоматически сохраняются в браузере.</p>
  <div class="control"><label>Разделение <output id="sepOut"></output></label><input id="separation" type="range" min="0" max="3" step=".1"></div>
  <div class="control"><label>Выравнивание <output id="aliOut"></output></label><input id="alignment" type="range" min="0" max="3" step=".1"></div>
  <div class="control"><label>Сплочение <output id="cohOut"></output></label><input id="cohesion" type="range" min="0" max="3" step=".1"></div>
  <div class="control"><label>Скорость <output id="speedOut"></output></label><input id="speed" type="range" min=".45" max="1.7" step=".05"></div>
  <div class="control"><label>Пузырьки <output id="bubbleOut"></output></label><input id="bubbleRate" type="range" min=".2" max="2.6" step=".1"></div>
  <div class="control"><label>Громкость <output id="volumeOut"></output></label><input id="volume" type="range" min="0" max="1" step=".05"></div>
  <div class="checks"><label class="check"><input id="sound" type="checkbox"> Звук воды</label><label class="check"><input id="caustics" type="checkbox"> Каустика</label></div>
  <div class="panel-actions"><button id="save">💾 Сохранить</button><button id="reset">↺ Сбросить</button></div>
 </aside>
 <nav class="dock glass" aria-label="Управление аквариумом"><button id="feed">🍽️ Покормить</button><button id="add">🐟 Добавить</button><button id="night" aria-pressed="false">🌙 Ночь</button><button id="soundBtn" aria-pressed="false">🔇 Звук</button><button id="settings" class="settings-button" aria-pressed="false" aria-label="Настройки">⚙️</button></nav>
 <div class="hint">Кликните по воде — рыбки на 2 секунды разбегутся от точки</div>
</div>
<script src="app-loader.js" defer></script>
</body>
</html>
